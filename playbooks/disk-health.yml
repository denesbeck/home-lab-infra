---
- name: Export disk presence and SMART metrics
  hosts: all
  become: true
  vars_files:
    - ../vars/disk-health.yml

  vars:
    disk_health_script: /usr/local/bin/disk-health.py
    disk_health_config: /etc/disk-health.json
    disk_health_metrics_dir: /var/lib/node-exporter/textfile

  handlers:
    - name: Apply udev rules
      shell: udevadm control --reload && udevadm trigger --subsystem-match=scsi_disk --action=add

  tasks:
    - name: Spin down USB disks before power-off
      copy:
        dest: /etc/udev/rules.d/60-usb-disk-shutdown.rules
        owner: root
        group: root
        mode: "0644"
        content: |
          ACTION=="add", SUBSYSTEM=="scsi_disk", ATTR{manage_shutdown}="1"
      notify: Apply udev rules

    - name: Install smartmontools
      apt:
        name: smartmontools
        state: present

    - name: Ensure textfile collector directory exists
      file:
        path: "{{ disk_health_metrics_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy expected disks
      copy:
        dest: "{{ disk_health_config }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ disk_health_devices | to_nice_json }}\n"

    - name: Deploy disk health exporter
      copy:
        dest: "{{ disk_health_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          {% raw %}#!/usr/bin/env python3
          import json
          import os
          import subprocess
          import time

          CONFIG = "/etc/disk-health.json"
          OUT = "/var/lib/node-exporter/textfile/disk_health.prom"

          ATA_ATTRIBUTES = {
              4: "start_stop_count",
              5: "reallocated_sector_ct",
              12: "power_cycle_count",
              187: "reported_uncorrect",
              188: "command_timeout",
              192: "power_off_retract_count",
              193: "load_cycle_count",
              197: "current_pending_sector",
              198: "offline_uncorrectable",
              199: "udma_crc_error_count",
          }


          def labels(**kv):
              body = ",".join('%s="%s"' % (k, str(v).replace("\\", "\\\\").replace('"', '\\"')) for k, v in kv.items())
              return "{" + body + "}"


          def attached_disks():
              out = subprocess.run(
                  ["lsblk", "-J", "-d", "-o", "NAME,SERIAL,TYPE"],
                  capture_output=True, text=True, check=True,
              ).stdout
              return {
                  d["serial"]: "/dev/" + d["name"]
                  for d in json.loads(out)["blockdevices"]
                  if d.get("type") == "disk" and d.get("serial")
              }


          def smart(device):
              # -n standby: never spin up a sleeping disk just to read counters.
              p = subprocess.run(
                  ["smartctl", "-j", "-a", "-n", "standby", device],
                  capture_output=True, text=True,
              )
              try:
                  return json.loads(p.stdout)
              except ValueError:
                  return {}


          def main():
              with open(CONFIG) as f:
                  expected = json.load(f)
              attached = attached_disks()
              lines = []

              def metric(name, value, **kv):
                  lines.append("%s%s %s" % (name, labels(**kv), value))

              for disk in expected:
                  lbl = {"label": disk["label"], "serial": disk["serial"]}
                  device = attached.get(disk["serial"])
                  metric("disk_present", 1 if device else 0, **lbl)
                  if not device:
                      continue

                  data = smart(device)
                  passed = data.get("smart_status", {}).get("passed")
                  metric("disk_smart_available", 0 if passed is None else 1, **lbl)
                  if passed is None:
                      continue
                  metric("disk_smart_passed", 1 if passed else 0, **lbl)

                  temp = data.get("temperature", {}).get("current")
                  if temp is not None:
                      metric("disk_temperature_celsius", temp, **lbl)

                  for row in data.get("ata_smart_attributes", {}).get("table", []):
                      name = ATA_ATTRIBUTES.get(row.get("id"))
                      if name:
                          metric("disk_ata_attribute_raw", row["raw"]["value"], attribute=name, **lbl)

                  selftest = data.get("ata_smart_self_test_log", {}).get("standard", {})
                  if "error_count_total" in selftest:
                      metric("disk_selftest_errors", selftest["error_count_total"], **lbl)

                  nvme = data.get("nvme_smart_health_information_log", {})
                  for key in ("critical_warning", "media_errors", "percentage_used", "available_spare"):
                      if key in nvme:
                          metric("disk_nvme_" + key, nvme[key], **lbl)

              lines.append("disk_health_last_run_timestamp_seconds %d" % time.time())
              tmp = OUT + ".tmp"
              with open(tmp, "w") as f:
                  f.write("\n".join(lines) + "\n")
              os.chmod(tmp, 0o644)
              os.replace(tmp, OUT)


          if __name__ == "__main__":
              main()
          {% endraw %}

    - name: Run disk health exporter every 10 minutes
      cron:
        name: "Disk health metrics"
        minute: "*/10"
        job: "{{ disk_health_script }} 2>&1 | logger -t disk-health"
        state: present
