---
- name: Set up NGINX with SSL (Let's Encrypt via Cloudflare DNS)
  hosts: all
  become: true

  vars_files:
    - ../vars/certbot.yml

  vars:
    certbot_domain: arcade-lab.io
    certbot_email: "{{ cloudflare_email }}"
    certbot_credentials_path: /root/.secrets/cloudflare.ini

  tasks:
    - name: Install NGINX
      package:
        name: nginx
        state: present

    - name: Install certbot and Cloudflare DNS plugin
      apt:
        name:
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
        update_cache: yes

    - name: Create secrets directory
      file:
        path: /root/.secrets
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy Cloudflare API credentials
      template:
        src: ../config/cloudflare.ini.j2
        dest: "{{ certbot_credentials_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Check if Let's Encrypt certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ certbot_domain }}/fullchain.pem"
      register: letsencrypt_cert

    - name: Obtain Let's Encrypt wildcard certificate via Cloudflare DNS
      command: >
        certbot certonly
        --dns-cloudflare
        --dns-cloudflare-credentials {{ certbot_credentials_path }}
        --dns-cloudflare-propagation-seconds 30
        -d {{ certbot_domain }}
        -d '*.{{ certbot_domain }}'
        --email {{ certbot_email }}
        --agree-tos
        --non-interactive
      when: not letsencrypt_cert.stat.exists

    - name: Check if DH parameters exist
      stat:
        path: /etc/ssl/certs/dhparam.pem
      register: dhparam_exists

    - name: Create Diffie-Hellman group
      command: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048
      when: not dhparam_exists.stat.exists

    - name: Set proper permissions on DH parameters
      file:
        path: /etc/ssl/certs/dhparam.pem
        owner: root
        group: root
        mode: '0644'
      when: dhparam_exists.stat.exists or not dhparam_exists.stat.exists

    - name: Remove the overnight certbot cron
      cron:
        name: "certbot-renew"
        user: root
        state: absent

    - name: Ensure certbot.timer is enabled
      systemd:
        name: certbot.timer
        enabled: yes
        state: started

    - name: Reload NGINX after every certificate renewal
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl reload nginx

    - name: Ensure textfile collector directory exists
      file:
        path: /var/lib/node-exporter/textfile
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy TLS certificate expiry check
      copy:
        dest: /usr/local/bin/tls-cert-check.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail

          HOST="vaultwarden.{{ certbot_domain }}"
          OUT=/var/lib/node-exporter/textfile/tls_cert.prom

          END="$(echo | timeout 10 openssl s_client -connect 127.0.0.1:443 -servername "$HOST" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)"

          {
              echo "# HELP tls_cert_not_after_timestamp_seconds Expiry of the certificate nginx serves."
              echo "# TYPE tls_cert_not_after_timestamp_seconds gauge"
              [ -n "$END" ] && echo "tls_cert_not_after_timestamp_seconds{host=\"$HOST\"} $(date -d "$END" +%s)"
              echo "# HELP tls_cert_check_last_run_timestamp_seconds Unix time of the last check."
              echo "# TYPE tls_cert_check_last_run_timestamp_seconds gauge"
              echo "tls_cert_check_last_run_timestamp_seconds $(date +%s)"
          } > "$OUT.tmp"
          chmod 0644 "$OUT.tmp"
          mv "$OUT.tmp" "$OUT"

    - name: Check the served certificate hourly
      cron:
        name: "TLS certificate expiry check"
        minute: "20"
        job: "/usr/local/bin/tls-cert-check.sh 2>&1 | logger -t tls-cert-check"
        user: root

    - name: Remove default NGINX site config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Add custom NGINX config for Docker
      template:
        src: ../config/nginx.conf.j2
        dest: /etc/nginx/sites-enabled/docker.conf

    - name: Validate NGINX config
      command: nginx -t
      changed_when: false

    - name: Restart NGINX service
      service:
        name: nginx
        state: restarted
        enabled: yes

    - name: Record the served certificate's expiry now
      command: /usr/local/bin/tls-cert-check.sh
      changed_when: false
