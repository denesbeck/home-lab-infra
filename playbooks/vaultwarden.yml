---
- name: Set up Vaultwarden container
  hosts: all
  become: true
  vars_files:
    - ../vars/vaultwarden.yml
    - ../vars/containers.yml

  tasks:
    # Holds db.sqlite3 and rsa_key.pem (JWT signing key), so the directory must
    # not be world-traversable. "o=" on the directory is the durable control:
    # Vaultwarden runs as root inside the container and recreates data files at
    # runtime, so their individual modes drift, but nothing outside the owner
    # can reach them through a 0750 parent.
    - name: Create Vaultwarden data directory
      file:
        path: "{{ vaultwarden_data_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: directory
        mode: "u=rwX,g=rX,o="
        recurse: yes

    - name: Find Vaultwarden data files
      find:
        paths: "{{ vaultwarden_data_path }}"
        recurse: yes
        file_type: file
      register: vaultwarden_data_files

    - name: Restrict Vaultwarden data file permissions
      file:
        path: "{{ item.path }}"
        mode: "0640"
      loop: "{{ vaultwarden_data_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure Vaultwarden container is running
      docker_container:
        name: "{{ vaultwarden_container_name }}"
        image: "{{ vaultwarden_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "127.0.0.1:{{ vaultwarden_port }}:80"
        env:
          DOMAIN: "https://vaultwarden.arcade-lab.io"
          SIGNUPS_ALLOWED: "false"
          INVITATIONS_ALLOWED: "false"
          SHOW_PASSWORD_HINT: "false"
        volumes:
          - "{{ vaultwarden_data_path }}:/data"
      register: vaultwarden_container

    - name: Check if the Vaultwarden container is running
      debug:
        msg: "Vaultwarden container is running with name: {{ vaultwarden_container_name }}"
      when: vaultwarden_container.changed
