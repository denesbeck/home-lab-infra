---
- name: Set up Prometheus/Grafana monitoring stack
  hosts: all
  become: true

  tasks:
    - name: Install Git
      apt:
        name: git
        state: present

    - name: Check if Docker is installed
      command: docker --version
      register: docker_version
      failed_when: docker_version.rc != 0
      changed_when: false

    - name: Check if Docker Compose is installed
      command: docker compose version
      register: docker_compose_version
      failed_when: docker_compose_version.rc != 0
      changed_when: false

    - name: Create /home/monitoring directory
      file:
        path: /home/monitoring
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Clone home-lab-monitoring repository
      git:
        repo: https://github.com/denesbeck/home-lab-monitoring
        dest: /home/monitoring
        depth: 1

    - name: Ensure ownership of /home/monitoring is set
      file:
        path: /home/monitoring
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes

    # analyzer/.env holds the Anthropic API key. It is gitignored upstream, so it
    # survives `git pull` and its mode has to be enforced here. Compose reads it
    # via env_file, which the Docker daemon parses as root, so dropping world
    # read does not affect the container (which runs as uid 10001).
    #
    # Deliberately NOT tightened here: alertmanager/{analyzer_token,discord_webhook}
    # are bind-mounted into claude-analyzer and readable by uid 10001 only via
    # their o+r bit. Fixing those means changing group ownership or the compose
    # `user:` in the home-lab-monitoring repo, not here.
    - name: Check for analyzer environment file
      stat:
        path: /home/monitoring/analyzer/.env
      register: analyzer_env_file

    - name: Restrict analyzer environment file permissions
      file:
        path: /home/monitoring/analyzer/.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0640"
      when: analyzer_env_file.stat.exists

    - name: Run git config command to add safe.directory
      command: git config --global --add safe.directory /home/monitoring
      args:
        chdir: /home/monitoring

    - name: Run Docker Compose to start services
      command: docker compose up -d
      args:
        chdir: /home/monitoring
