---
- name: Setup hourly Vaultwarden backup to S3
  hosts: all
  become: true
  vars_files:
    - ../vars/vaultwarden.yml
    - ../vars/containers.yml

  vars:
    backup_script_path: /usr/local/bin/backup-vaultwarden.sh
    backup_log_path: /var/log/backup-vaultwarden.log
    backup_tmp_path: /tmp/vaultwarden-backup
    # Reuse Alertmanager's webhook so no secret lives in this repo.
    backup_webhook_file: /home/monitoring/alertmanager/discord_webhook
    backup_metrics_dir: /var/lib/node-exporter/textfile
    backup_metrics_file: /var/lib/node-exporter/textfile/vaultwarden_backup.prom

  tasks:
    - name: Check if AWS CLI v2 is installed
      command: aws --version
      register: aws_cli_check
      changed_when: false
      failed_when: false

    - name: Install AWS CLI v2
      when: aws_cli_check.rc != 0 or 'aws-cli/2' not in (aws_cli_check.stdout + aws_cli_check.stderr)
      block:
        - name: Install unzip and sqlite3
          apt:
            name:
              - unzip
              - sqlite3
            state: present
            update_cache: yes

        - name: Download AWS CLI v2
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_architecture }}.zip"
            dest: /tmp/awscliv2.zip

        - name: Unzip AWS CLI v2
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: yes

        - name: Install AWS CLI v2
          command: /tmp/aws/install --update

        - name: Cleanup installer
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/awscliv2.zip
            - /tmp/aws

    - name: Create AWS credentials directory
      file:
        path: /root/.aws
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy AWS credentials
      copy:
        dest: /root/.aws/credentials
        owner: root
        group: root
        mode: "0600"
        content: |
          [default]
          aws_access_key_id = {{ vaultwarden_backup_aws_access_key_id }}
          aws_secret_access_key = {{ vaultwarden_backup_aws_secret_access_key }}

    - name: Deploy AWS config
      copy:
        dest: /root/.aws/config
        owner: root
        group: root
        mode: "0600"
        content: |
          [default]
          region = {{ vaultwarden_backup_s3_region }}

    # Shared with the UPS monitor; created here so this playbook stands alone.
    - name: Ensure textfile collector directory exists
      file:
        path: "{{ backup_metrics_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create backup script
      copy:
        dest: "{{ backup_script_path }}"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # -E so the ERR trap is inherited by functions and subshells.
          set -Eeuo pipefail

          DATA_PATH="{{ vaultwarden_data_path }}"
          S3_BUCKET="{{ vaultwarden_backup_s3_bucket }}"
          CONTAINER="{{ vaultwarden_container_name }}"
          TMP_DIR="{{ backup_tmp_path }}"
          WEBHOOK_FILE="{{ backup_webhook_file }}"
          METRICS_FILE="{{ backup_metrics_file }}"
          HOST="$(hostname)"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BACKUP_FILE="vaultwarden_${TIMESTAMP}.tar.gz"

          log_message() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1"
          }

          read_metric() {
              [ -r "$METRICS_FILE" ] || { echo 0; return 0; }
              awk -v k="$1" '$1 == k { v = $2 } END { print (v == "" ? 0 : v) }' "$METRICS_FILE"
          }

          # Carried forward so a failed run does not erase the last-success
          # timestamp the staleness alert reads.
          LAST_SUCCESS="$(read_metric vaultwarden_backup_last_success_timestamp_seconds)"
          LAST_SIZE="$(read_metric vaultwarden_backup_size_bytes)"
          PREV_RUN="$(read_metric vaultwarden_backup_last_run_timestamp_seconds)"
          PREV_SUCCESS="$(read_metric vaultwarden_backup_success)"

          write_metrics() {
              local success="$1"
              printf '%s\n' \
                  "# HELP vaultwarden_backup_success Whether the most recent backup run succeeded (1 = yes, 0 = no)." \
                  "# TYPE vaultwarden_backup_success gauge" \
                  "vaultwarden_backup_success ${success}" \
                  "# HELP vaultwarden_backup_last_run_timestamp_seconds Unix time of the most recent backup attempt." \
                  "# TYPE vaultwarden_backup_last_run_timestamp_seconds gauge" \
                  "vaultwarden_backup_last_run_timestamp_seconds $(date +%s)" \
                  "# HELP vaultwarden_backup_last_success_timestamp_seconds Unix time of the last backup that reached S3." \
                  "# TYPE vaultwarden_backup_last_success_timestamp_seconds gauge" \
                  "vaultwarden_backup_last_success_timestamp_seconds ${LAST_SUCCESS}" \
                  "# HELP vaultwarden_backup_size_bytes Size of the last archive that reached S3." \
                  "# TYPE vaultwarden_backup_size_bytes gauge" \
                  "vaultwarden_backup_size_bytes ${LAST_SIZE}" \
                  > "${METRICS_FILE}.tmp"
              chmod 0644 "${METRICS_FILE}.tmp"
              mv "${METRICS_FILE}.tmp" "$METRICS_FILE"
          }

          notify() {
              [ -r "$WEBHOOK_FILE" ] || { log_message "webhook file $WEBHOOK_FILE unreadable, skip notify"; return 0; }
              local url payload
              url="$(head -n1 "$WEBHOOK_FILE")"
              [ -n "$url" ] || { log_message "empty webhook url, skip notify"; return 0; }
              payload="$(python3 -c 'import json,sys; print(json.dumps({"content": sys.argv[1]}))' "$1")"
              curl -fsS -m 10 -H 'Content-Type: application/json' -d "$payload" "$url" >/dev/null 2>&1 \
                  || log_message "notify failed (network down?)"
              return 0
          }

          cleanup() {
              rm -rf "$TMP_DIR"
          }

          # Failures used to reach a log file and nowhere else. The stale
          # last-success metric covers what this cannot: cron never firing.
          on_error() {
              local rc=$?
              local line="$1"
              set +e
              log_message "ERROR: backup failed with exit $rc at line $line"
              write_metrics 0
              local stale="never"
              [ "$LAST_SUCCESS" != "0" ] && stale="$(date -u -d "@$LAST_SUCCESS" '+%Y-%m-%d %H:%M:%S UTC')"
              notify ":rotating_light: **Vaultwarden backup FAILED** on \`$HOST\` — exit $rc at line $line. Last backup that reached S3: \`$stale\`. Log: \`{{ backup_log_path }}\`"
              exit "$rc"
          }

          trap cleanup EXIT
          trap 'on_error $LINENO' ERR

          mkdir -p "$TMP_DIR"

          log_message "Starting Vaultwarden backup"

          log_message "Creating SQLite backup"
          sqlite3 "$DATA_PATH/db.sqlite3" ".backup '$TMP_DIR/db-backup.sqlite3'"

          log_message "Copying data directory"
          cp -r "$DATA_PATH" "$TMP_DIR/data"
          mv "$TMP_DIR/db-backup.sqlite3" "$TMP_DIR/data/db.sqlite3"
          rm -f "$TMP_DIR/data/db.sqlite3-wal" "$TMP_DIR/data/db.sqlite3-shm"

          # Stamp the backup with the Vaultwarden version that produced it.
          # Schema migrations are forward-only: a newer binary upgrades an older
          # DB, but an older binary cannot open a DB a newer one has migrated.
          # The DR failover reads this file so it restores data and binary as a
          # matched pair instead of gambling on whatever :latest is that day.
          VW_VERSION=$(docker inspect \
              --format '{{ '{{' }}index .Config.Labels "org.opencontainers.image.version"{{ '}}' }}' \
              "$CONTAINER" 2>/dev/null || echo "")

          if [ -z "$VW_VERSION" ] || [ "$VW_VERSION" = "<no value>" ]; then
              log_message "WARNING: could not read Vaultwarden version label; recording 'latest'"
              VW_VERSION="latest"
          fi

          echo "$VW_VERSION" > "$TMP_DIR/VAULTWARDEN_VERSION"
          log_message "Backup taken from Vaultwarden $VW_VERSION"

          log_message "Compressing backup"
          tar -czf "$TMP_DIR/$BACKUP_FILE" -C "$TMP_DIR" data VAULTWARDEN_VERSION

          log_message "Uploading to s3://$S3_BUCKET/$BACKUP_FILE"
          aws s3 cp "$TMP_DIR/$BACKUP_FILE" "s3://$S3_BUCKET/$BACKUP_FILE"

          LAST_SUCCESS="$(date +%s)"
          LAST_SIZE="$(stat -c %s "$TMP_DIR/$BACKUP_FILE")"
          write_metrics 1

          # PREV_RUN guard: on the first ever run every metric reads 0, which is
          # not a recovery.
          if [ "$PREV_RUN" != "0" ] && [ "$PREV_SUCCESS" = "0" ]; then
              notify ":white_check_mark: **Vaultwarden backup recovered** on \`$HOST\` — upload succeeded again."
          fi

          log_message "Backup completed successfully"

    - name: Create log file with proper permissions
      file:
        path: "{{ backup_log_path }}"
        state: touch
        owner: root
        group: root
        mode: "0644"

    # Runs at :30, not :00. The daily `shutdown -r now` cron in backup.yml
    # fires at 03:00, so an on-the-hour backup starts while the network is
    # being torn down and dies at the S3 upload with "Could not connect to
    # the endpoint URL" — observed 2026-08-08/09/11/14/18/30 and 09-08/11,
    # always at exactly 030001. The next hourly run recovers, but the script
    # is `set -euo pipefail` so the failure only ever reaches a log file.
    - name: Setup hourly backup cronjob
      cron:
        name: "Hourly Vaultwarden backup to S3"
        minute: "30"
        job: "{{ backup_script_path }} >> {{ backup_log_path }} 2>&1"
        state: present
