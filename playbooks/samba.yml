- name: Install and configure Samba
  hosts: all
  become: true
  tasks:
    - import_tasks: ../tasks/update-packages.yml

    - name: Install Samba package
      apt:
        name: samba
        state: present
        update_cache: yes

    - name: Create samba group
      group:
        name: smbgroup
        state: present

    # Samba-only service account: it authenticates against smbpasswd, never
    # against PAM, so it has no need for an interactive login shell.
    - name: Create samba user and group
      user:
        name: smbuser
        group: smbgroup
        state: present
        create_home: false
        shell: /usr/sbin/nologin

    - import_tasks: ../tasks/generate-password.yml

    - name: Add samba user with generated password
      expect:
        command: smbpasswd -a smbuser
        responses:
          "New SMB password:": "{{ password }}"
          "Retype new SMB password:": "{{ password }}"
      register: smbpasswd_result

    - name: Ensure smbpasswd was successful
      debug:
        msg: "Samba user added with password"
      when: smbpasswd_result.rc == 0
      failed_when: smbpasswd_result.rc != 0

    - name: Backup current smb.conf
      copy:
        src: /etc/samba/smb.conf
        dest: "/etc/samba/smb.conf.bak.{{ ansible_date_time.date | replace('-', '') }}{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"
        remote_src: yes
        backup: yes

    - name: Configure smb.conf with custom settings
      template:
        src: ../config/smb.conf.j2
        dest: /etc/samba/smb.conf
      notify:
        - Restart samba

    # The samba package ships no logrotate rule here, and the stock one would
    # not match the custom log path anyway.
    - name: Deploy logrotate rule for Samba logs
      copy:
        dest: /etc/logrotate.d/samba
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/samba/log.* {
              weekly
              rotate 4
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                  [ -f /run/samba/smbd.pid ] && kill -HUP "$(cat /run/samba/smbd.pid)" || true
                  [ -f /run/samba/nmbd.pid ] && kill -HUP "$(cat /run/samba/nmbd.pid)" || true
              endscript
          }

    # Cleans up the old %I%t.log backlog; anything not named log.* is from that
    # scheme. No-op on every subsequent run.
    - name: Remove legacy per-connection Samba logs
      shell: |
        set -o pipefail
        count=$(find /var/log/samba -maxdepth 1 -type f ! -name 'log.*' -printf . | wc -c)
        if [ "$count" -gt 0 ]; then
            find /var/log/samba -maxdepth 1 -type f ! -name 'log.*' -delete
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: samba_legacy_logs
      changed_when: samba_legacy_logs.stdout | trim | int > 0

  handlers:
    - name: Restart samba
      service:
        name: smbd
        state: restarted
