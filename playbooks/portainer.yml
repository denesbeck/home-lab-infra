---
- name: Set up Portainer container
  hosts: all
  become: true
  vars_files:
    - ../vars/portainer.yml
    - ../vars/containers.yml

  tasks:
    # Holds portainer.key and the TLS keypair under certs/, so the directory
    # must not be world-traversable. See the equivalent note in vaultwarden.yml.
    - name: Create Portainer data directory
      file:
        path: "{{ portainer_data_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: directory
        mode: "u=rwX,g=rX,o="
        recurse: yes

    - name: Find Portainer data files
      find:
        paths: "{{ portainer_data_path }}"
        recurse: yes
        file_type: file
      register: portainer_data_files

    - name: Restrict Portainer data file permissions
      file:
        path: "{{ item.path }}"
        mode: "0640"
      loop: "{{ portainer_data_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure Portainer container is running
      docker_container:
        name: "{{ portainer_container_name }}"
        image: "{{ portainer_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "127.0.0.1:9000:9000"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ portainer_data_path }}:/data"
      register: portainer_container

    - name: Check if the Portainer container is running
      debug:
        msg: "Portainer container is running with name: {{ portainer_container_name }}"
      when: portainer_container.changed
