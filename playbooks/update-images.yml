---
# Vaultwarden holds the password vault and its schema migrations are one-way:
# the new binary migrates db.sqlite3 in place on first start, and rolling the
# image back afterwards will not open the migrated DB. Take a fresh restore
# point before anything is upgraded, and abort the whole run if it fails.
- name: Snapshot Vaultwarden before upgrading any image
  hosts: all
  become: true
  any_errors_fatal: true

  tasks:
    - name: Check the Vaultwarden backup script is deployed
      stat:
        path: /usr/local/bin/backup-vaultwarden.sh
      register: vaultwarden_backup_script

    - name: Fail when the Vaultwarden backup script is missing
      fail:
        msg: >-
          /usr/local/bin/backup-vaultwarden.sh not found. Run
          playbooks/backup-vaultwarden.yml first — the vault must have a fresh
          pre-upgrade restore point before its image is replaced.
      when: not vaultwarden_backup_script.stat.exists

    - name: Take a pre-upgrade Vaultwarden backup
      shell: |
        set -o pipefail
        /usr/local/bin/backup-vaultwarden.sh 2>&1 | tee -a /var/log/backup-vaultwarden.log
      args:
        executable: /bin/bash
      changed_when: true

- name: Pull latest container images
  hosts: all
  become: true

  vars_files:
    - ../vars/containers.yml

  tasks:
    - name: Pull latest version of each container image
      docker_image:
        name: "{{ item }}"
        source: pull
        force_source: true
      loop:
        - "{{ jellyfin_image }}"
        - "{{ qbittorrent_image }}"
        - "{{ portainer_image }}"
        - "{{ pihole_image }}"
        - "{{ filebrowser_image }}"
        - "{{ vaultwarden_image }}"

    - name: Pull latest images for monitoring stack
      command: docker compose pull
      args:
        chdir: /home/monitoring
      register: monitoring_pull
      changed_when: "'Pulled' in monitoring_pull.stderr or 'Pulled' in monitoring_pull.stdout"

    - name: Recreate monitoring stack containers with new images
      command: docker compose up -d
      args:
        chdir: /home/monitoring
      when: monitoring_pull.changed

# Re-run per-service playbooks. docker_container compares image IDs strictly,
# so containers are recreated only when the freshly pulled image differs.
- import_playbook: ./jellyfin.yml
- import_playbook: ./qbittorrent.yml
- import_playbook: ./portainer.yml
- import_playbook: ./pihole.yml
- import_playbook: ./filebrowser.yml
- import_playbook: ./vaultwarden.yml

- name: Clean up old images
  hosts: all
  become: true
  tasks:
    - name: Prune dangling images
      docker_prune:
        images: true
        images_filters:
          dangling: true
