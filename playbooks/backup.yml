---
- name: Setup snapshot backups with rotation
  hosts: all
  become: true

  vars:
    backup_destination: /mnt/backups
    backup_metrics_dir: /var/lib/node-exporter/textfile
    backup_user: "{{ ansible_user }}"
    backup_group: "{{ ansible_user }}"
    # One entry per source. Everything else -- script, log, lock, metrics file,
    # snapshot prefix, metric prefix -- is derived from `name`, so the photos
    # job keeps the exact paths and metric names the alert rules already read.
    # Sources live on the Seagate, the destination on the WD: a snapshot is
    # only worth having while the two are different physical disks.
    backup_jobs:
      # Snapshots every 6h, so 120 keeps the same 30 days of history as the old
      # daily run. Hardlinked snapshots cost ~756K each, so depth is nearly free.
      - name: photos
        source: /mnt/photos
        retain: 120
        # :15 clears both the 03:00 reboot and the Vaultwarden backup at :30.
        minute: "15"
        hour: "0,6,12,18"
        cron_name: "Photo backup"
      # 258M across 433 files, so the copy is quick and the retention is free.
      # :45 keeps it clear of photos at :15 and Vaultwarden at :30.
      - name: private
        source: /mnt/private
        retain: 120
        minute: "45"
        hour: "0,6,12,18"
        cron_name: "Private backup"

  tasks:
    - name: Ensure backup destination directory exists
      file:
        path: "{{ backup_destination }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: "0755"

    - name: Ensure textfile collector directory exists
      file:
        path: "{{ backup_metrics_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create backup scripts
      copy:
        dest: "/usr/local/bin/backup-{{ item.name }}.sh"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # -E so the ERR trap is inherited by functions and subshells.
          set -Eeuo pipefail

          SOURCE="{{ item.source }}"
          BACKUP_BASE="{{ backup_destination }}"
          METRICS_FILE="{{ backup_metrics_dir }}/{{ item.name }}_backup.prom"
          LOCK_FILE="/run/backup-{{ item.name }}.lock"
          RETAIN={{ item.retain }}
          PREFIX="{{ item.name }}"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BACKUP_DIR="${BACKUP_BASE}/${PREFIX}_${TIMESTAMP}"

          # stdout only -- cron redirects to the log; tee'ing as well wrote every line twice.
          log_message() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1"
          }

          read_metric() {
              [ -r "$METRICS_FILE" ] || { echo 0; return 0; }
              awk -v k="$1" '$1 == k { v = $2 } END { print (v == "" ? 0 : v) }' "$METRICS_FILE"
          }

          # Carried forward so a failed run keeps the timestamp the staleness alert reads.
          LAST_SUCCESS="$(read_metric {{ item.name }}_backup_last_success_timestamp_seconds)"
          LAST_SIZE="$(read_metric {{ item.name }}_backup_size_bytes)"
          LAST_FILES="$(read_metric {{ item.name }}_backup_file_count)"

          write_metrics() {
              local success="$1"
              printf '%s\n' \
                  "# HELP {{ item.name }}_backup_success Whether the most recent backup run succeeded (1 = yes, 0 = no)." \
                  "# TYPE {{ item.name }}_backup_success gauge" \
                  "{{ item.name }}_backup_success ${success}" \
                  "# HELP {{ item.name }}_backup_last_run_timestamp_seconds Unix time of the most recent backup attempt." \
                  "# TYPE {{ item.name }}_backup_last_run_timestamp_seconds gauge" \
                  "{{ item.name }}_backup_last_run_timestamp_seconds $(date +%s)" \
                  "# HELP {{ item.name }}_backup_last_success_timestamp_seconds Unix time of the last snapshot that completed and passed verification." \
                  "# TYPE {{ item.name }}_backup_last_success_timestamp_seconds gauge" \
                  "{{ item.name }}_backup_last_success_timestamp_seconds ${LAST_SUCCESS}" \
                  "# HELP {{ item.name }}_backup_size_bytes Size of the last verified snapshot." \
                  "# TYPE {{ item.name }}_backup_size_bytes gauge" \
                  "{{ item.name }}_backup_size_bytes ${LAST_SIZE}" \
                  "# HELP {{ item.name }}_backup_file_count Regular files in the last verified snapshot." \
                  "# TYPE {{ item.name }}_backup_file_count gauge" \
                  "{{ item.name }}_backup_file_count ${LAST_FILES}" \
                  > "${METRICS_FILE}.tmp"
              chmod 0644 "${METRICS_FILE}.tmp"
              mv "${METRICS_FILE}.tmp" "$METRICS_FILE"
          }

          on_error() {
              local rc=$?
              local line="$1"
              set +e
              log_message "ERROR: backup failed with exit $rc at line $line"
              write_metrics 0
              exit "$rc"
          }

          trap 'on_error $LINENO' ERR

          # Runs must not overlap. A snapshot is sub-second while nothing has
          # changed, but the run after a bulk import copies for real -- the
          # 2026-09-16 full copy took 1h51m -- and a second rsync against the
          # same source would race the first over LINK_DEST and rotation.
          # Non-blocking: a skipped slot is not a failure, so it leaves the
          # metrics alone and waits for the next one rather than queueing.
          exec 9>"$LOCK_FILE"
          if ! flock -n 9; then
              log_message "another run holds $LOCK_FILE - skipping this slot"
              exit 0
          fi

          # `-d` is not a mount check: both paths exist as empty directories on the
          # root filesystem when their USB enclosure is absent.
          require_mounted() {
              local target="$1"
              if ! findmnt --noheadings --mountpoint "$target" >/dev/null 2>&1; then
                  log_message "ERROR: $target is not a mounted filesystem - aborting"
                  write_metrics 0
                  exit 1
              fi
          }

          require_mounted "$SOURCE"
          require_mounted "$BACKUP_BASE"

          SRC_FILES=$(find "$SOURCE" -type f | wc -l)
          if [ "$SRC_FILES" -eq 0 ]; then
              log_message "ERROR: $SOURCE is mounted but contains no files - aborting rather than snapshotting an empty source"
              write_metrics 0
              exit 1
          fi

          # Newest snapshot that actually holds files, used as the hardlink source:
          # anything unchanged since then costs a link() instead of a copy. Chosen
          # before $BACKUP_DIR exists so it cannot pick itself. A stale or partial
          # reference is safe -- rsync just copies whatever does not match it.
          LINK_DEST=""
          while IFS= read -r candidate; do
              if [ -n "$(find "$candidate" -type f -print -quit 2>/dev/null)" ]; then
                  LINK_DEST="$candidate"
                  break
              fi
          done < <(find "$BACKUP_BASE" -maxdepth 1 -type d -name "${PREFIX}_*" | sort -r)

          RSYNC_OPTS=(-aAXHS --stats)
          if [ -n "$LINK_DEST" ]; then
              RSYNC_OPTS+=(--link-dest="$LINK_DEST")
              log_message "Hardlinking unchanged files against $(basename "$LINK_DEST")"
          else
              log_message "No previous snapshot found - this run copies in full"
          fi

          log_message "Starting backup of $SOURCE ($SRC_FILES files) to $BACKUP_DIR"

          mkdir -p "$BACKUP_DIR"
          chown {{ ansible_user }}:{{ ansible_user }} "$BACKUP_DIR"

          # -v listed all 15k files every night even when every one was a link;
          # --stats keeps the transfer summary without the per-file noise.
          if rsync "${RSYNC_OPTS[@]}" "$SOURCE/" "$BACKUP_DIR/"; then
              log_message "rsync completed to $BACKUP_DIR"
          else
              log_message "ERROR: rsync failed"
              rm -rf "$BACKUP_DIR"
              write_metrics 0
              exit 1
          fi

          # Rotation deletes real backups, so only run it on a complete snapshot.
          DST_FILES=$(find "$BACKUP_DIR" -type f | wc -l)
          if [ "$DST_FILES" -lt "$SRC_FILES" ]; then
              log_message "ERROR: snapshot has $DST_FILES of $SRC_FILES files - keeping it for inspection and refusing to rotate"
              write_metrics 0
              exit 1
          fi

          LAST_SUCCESS="$(date +%s)"
          LAST_SIZE="$(du -sb "$BACKUP_DIR" | cut -f1)"
          LAST_FILES="$DST_FILES"
          log_message "Verified snapshot: $DST_FILES files, $LAST_SIZE bytes"

          # An aborted run leaves an empty ${PREFIX}_* directory behind, and rotation
          # counts by name, so it claims a slot and evicts a real backup -- which
          # cost two good snapshots on 2026-09-16. Purge those before rotating.
          while IFS= read -r candidate; do
              if [ -z "$(find "$candidate" -type f -print -quit 2>/dev/null)" ]; then
                  log_message "Removing empty snapshot directory: $candidate"
                  rm -rf "$candidate"
              fi
          done < <(find "$BACKUP_BASE" -maxdepth 1 -type d -name "${PREFIX}_*")

          log_message "Starting backup rotation (keeping last $RETAIN)"

          # Fixed-width ${PREFIX}_YYYYMMDDHHMMSS names, so reverse sort is newest-first.
          find "$BACKUP_BASE" -maxdepth 1 -type d -name "${PREFIX}_*" | \
              sort -r | \
              tail -n "+$((RETAIN + 1))" | \
              while IFS= read -r old_backup; do
                  if [[ -n "$old_backup" && "$old_backup" != "$BACKUP_BASE" ]]; then
                      log_message "Removing old backup: $old_backup"
                      rm -rf "$old_backup"
                  fi
              done

          log_message "Backup rotation completed"

          log_message "Current backups:"
          find "$BACKUP_BASE" -maxdepth 1 -type d -name "${PREFIX}_*" -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' | sort -r

          write_metrics 1
          log_message "Backup process finished successfully"
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create log files with proper permissions
      file:
        path: "/var/log/backup-{{ item.name }}.log"
        state: touch
        owner: "root"
        group: "root"
        mode: "0644"
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    # The cron `name` is the marker Ansible matches on, so the old daily entry
    # has to be retired by name or it would linger alongside the new schedule.
    - name: Remove superseded daily backup cronjob
      cron:
        name: "Daily photo backup"
        state: absent

    - name: Setup backup cronjobs every 6 hours
      cron:
        name: "{{ item.cron_name }}"
        minute: "{{ item.minute }}"
        hour: "{{ item.hour }}"
        job: "/usr/local/bin/backup-{{ item.name }}.sh >> /var/log/backup-{{ item.name }}.log 2>&1"
        state: present
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Setup daily restart cronjob at 3 AM
      cron:
        name: "Daily restart"
        minute: "0"
        hour: "3"
        job: "shutdown -r now"
        state: present

    - name: Verify backup scripts are executable
      file:
        path: "/usr/local/bin/backup-{{ item.name }}.sh"
        mode: "0755"
        state: file
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Display backup configuration
      debug:
        msg: >-
          {{ item.name }}: {{ item.source }} -> {{ backup_destination }}/{{ item.name }}_*
          | cron {{ item.minute }} {{ item.hour }}
          | keep {{ item.retain }}
          | log /var/log/backup-{{ item.name }}.log
          | metrics {{ backup_metrics_dir }}/{{ item.name }}_backup.prom
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"
