---
- name: Configure UFW and Allow Custom Ports
  hosts: all
  become: true
  vars_files:
    - ../vars/ssh.yml
  tasks:
    - name: Ensure UFW is installed
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Disable all incoming traffic
      ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Allow SSH port
      ufw:
        rule: allow
        port: "{{ ssh_port }}"

    - name: Allow SMB port 445
      ufw:
        rule: allow
        port: 445

    - name: Allow Nginx Full
      ufw:
        rule: allow
        name: "Nginx Full"

    - name: Allow incoming traffic on Tailscale interface
      ufw:
        rule: allow
        interface: tailscale0
        direction: in

    # Without this, default-deny drops container -> host :53 and every container
    # silently falls back to the 8.8.8.8 in its resolv.conf, bypassing Pi-hole.
    # Matched on Docker's subnet pool, not the interface, so it survives compose
    # recreating its network and renaming br-<hash>.
    - name: Allow container DNS queries to Pi-hole on the Docker bridges
      ufw:
        rule: allow
        direction: in
        from_ip: 172.16.0.0/12
        to_port: "53"
        proto: "{{ item }}"
        comment: "Docker containers -> Pi-hole DNS"
      loop:
        - udp
        - tcp

    - name: Reload UFW to apply changes
      ufw:
        state: reloaded
