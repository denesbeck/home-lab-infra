---
- name: Install Docker and configure non-root user on Ubuntu
  hosts: all
  become: true

  tasks:
    - import_tasks: ../tasks/update-packages.yml

    - name: Install required packages for Docker
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Create directory for keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get system architecture
      command: dpkg --print-architecture
      register: system_arch
      changed_when: false

    - name: Get Ubuntu codename
      shell: . /etc/os-release && echo ${UBUNTU_CODENAME:-$VERSION_CODENAME}
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker repository to Apt sources
      apt_repository:
        repo: "deb [arch={{ system_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Update apt package list again after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Create Docker group if it doesn't exist
      group:
        name: docker
        state: present

    - name: Add user to Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # json-file keeps every container's stdout forever by default. Set on the
    # daemon so it also covers the monitoring repo's compose containers. Applies
    # at container creation only — existing ones convert when recreated.
    - name: Set daemon-wide container log rotation
      copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      register: docker_daemon_config

    - name: Create Docker systemd override directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Deploy wait_for_network script
      copy:
        src: ../scripts/wait_for_network.sh
        dest: /etc/systemd/system/docker.service.d/wait_for_network.sh
        mode: "0755"

    - name: Add systemd override to wait for network before Docker
      copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        content: |
          [Unit]
          Requires=network-online.target docker.socket
          After=network-online.target tailscaled.service
          # StartLimitIntervalSec=0 disables systemd's start-rate limiter so
          # Restart=always retries forever until the network is up. Without this,
          # 3 fast ExecStartPre timeouts inside 60s tripped "start request repeated
          # too quickly" and left the daemon permanently dead (2026-07-16 incident).
          StartLimitIntervalSec=0

          [Service]
          ExecStartPre=/etc/systemd/system/docker.service.d/wait_for_network.sh
          Restart=always
          RestartSec=10
        mode: "0644"
      register: docker_override

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: docker_override.changed

    - name: Ensure Docker is running and enabled at boot
      service:
        name: docker
        state: started
        enabled: yes

    # A restart takes every container down, Pi-hole included, so it is a LAN DNS
    # outage. Only do it when config actually changed; the task above still
    # guarantees the daemon is up.
    - name: Restart Docker service to pick up config changes
      service:
        name: docker
        state: restarted
      when: docker_override.changed or docker_daemon_config.changed
