---
- name: Setup and mount volumes
  hosts: all
  become: true
  vars_files:
    - ../vars/fstab.yml

  vars:
    mount_retry_script_path: /usr/local/bin/mount-retry.sh
    managed_mounts:
      - /mnt/private
      - /mnt/photos
      - /mnt/movies
      - /mnt/backups

  tasks:
    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop: "{{ managed_mounts }}"

    - name: Set permissions directories
      file:
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
        recurse: yes
      loop: "{{ managed_mounts }}"

    # regexp matches the mount point so changed options replace the entry
    # instead of appending a duplicate.
    - name: Add /mnt/private to /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/private\s'
        line: "{{ private_mount }}"
        create: yes
        state: present

    - name: Add /mnt/photos to /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/photos\s'
        line: "{{ photos_mount }}"
        create: yes
        state: present

    - name: Add /mnt/movies to /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/movies\s'
        line: "{{ movies_mount }}"
        create: yes
        state: present

    - name: Add /mnt/backups to /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/backups\s'
        line: "{{ backups_mount }}"
        create: yes
        state: present

    # systemd never retries a mount whose device was absent at boot. Not
    # x-systemd.automount: an autofs trigger resolves once at Docker bind-mount
    # time and would hand containers an empty directory.
    - name: Create mount retry script
      copy:
        dest: "{{ mount_retry_script_path }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -uo pipefail

          # Space separated rather than an array: the mount points are a fixed
          # list from the playbook and contain no spaces, and bash's array-length
          # syntax opens with the two characters Jinja reads as a comment, which
          # breaks templating of this file.
          remounted=""

          for target in {{ managed_mounts | join(' ') }}; do
              findmnt --noheadings --mountpoint "$target" >/dev/null 2>&1 && continue
              if mount "$target" >/dev/null 2>&1; then
                  logger -t mount-retry "mounted $target"
                  remounted="$remounted $target"
              fi
          done

          [ -n "$remounted" ] || exit 0

          # A Docker bind mount is resolved once, at container start, and is
          # rprivate -- nothing that happens to the host mount afterwards reaches
          # it. So a container that started while the enclosure was absent holds
          # the empty directory on the root LV, and one that was running through a
          # USB drop holds the detached filesystem. Both show an empty folder for
          # as long as the container lives, silently: the mount is healthy on the
          # host, so no filesystem alert has anything to fire on. Both cost
          # filebrowser its photos and private folders on 2026-09-18. A restart is
          # the only thing that re-resolves the bind.
          command -v docker >/dev/null 2>&1 || exit 0
          docker info >/dev/null 2>&1 || exit 0

          affected=""
          for container in $(docker ps --format '{% raw %}{{.Names}}{% endraw %}' 2>/dev/null); do
              binds="$(docker inspect -f '{% raw %}{{range .Mounts}}{{if eq .Type "bind"}}{{println .Source}}{{end}}{{end}}{% endraw %}' "$container" 2>/dev/null)" || continue
              match=""
              # A bind *under* a remounted path is just as stale as one on it --
              # qbittorrent binds /mnt/movies/__DOWNLOADS__, not /mnt/movies.
              while IFS= read -r source; do
                  [ -n "$source" ] || continue
                  for target in $remounted; do
                      case "$source" in
                          "$target"|"$target"/*) match=1; break 2 ;;
                      esac
                  done
              done <<<"$binds"
              [ -n "$match" ] || continue
              case " $affected " in
                  *" $container "*) ;;
                  *) affected="$affected $container" ;;
              esac
          done

          for container in $affected; do
              logger -t mount-retry "restarting $container to rebind remounted paths"
              docker restart "$container" >/dev/null 2>&1 \
                  || logger -t mount-retry "ERROR: failed to restart $container"
          done

          exit 0

    - name: Create mount retry systemd service
      copy:
        dest: /etc/systemd/system/mount-retry.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Re-attempt fstab mounts whose device was late to enumerate
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart={{ mount_retry_script_path }}

    - name: Create mount retry systemd timer
      copy:
        dest: /etc/systemd/system/mount-retry.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry late fstab mounts every minute

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit=mount-retry.service

          [Install]
          WantedBy=timers.target

    - name: Enable and start mount retry timer
      systemd:
        name: mount-retry.timer
        enabled: true
        state: started
        daemon_reload: true
